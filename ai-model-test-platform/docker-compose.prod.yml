version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ai-test-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: AiTest2024!@#
      MYSQL_DATABASE: ai_test
      MYSQL_USER: aitest
      MYSQL_PASSWORD: AiTest2024!@#
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - ai-test-network

  redis:
    image: redis:7-alpine
    container_name: ai-test-redis
    restart: always
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-test-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ai-test-backend
    restart: always
    ports:
      - "18000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://aitest:AiTest2024!%40%23@mysql:3306/ai_test
      - REDIS_URL=redis://redis:6379/0
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SECRET_KEY=${SECRET_KEY:-ai-model-test-platform-secret-key-2024}
      - DEBUG=false
    depends_on:
      - mysql
      - redis
    networks:
      - ai-test-network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ai-test-celery
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://aitest:AiTest2024!%40%23@mysql:3306/ai_test
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-ai-model-test-platform-secret-key-2024}
      - DEBUG=false
    depends_on:
      - mysql
      - redis
    command: celery -A app.tasks.celery_app worker --loglevel=info
    networks:
      - ai-test-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: ai-test-frontend
    restart: always
    ports:
      - "13000:80"
    depends_on:
      - backend
    networks:
      - ai-test-network

volumes:
  mysql_data:
  redis_data:

networks:
  ai-test-network:
    driver: bridge
